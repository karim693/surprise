<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 Tasneem · love game</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 30% 10%, #1a0b0f, #2d1420, #1e0f14);
      padding: 16px;
      margin: 0;
    }

    .card {
      max-width: 640px;
      width: 100%;
      background: rgba(40, 20, 30, 0.5);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 64px;
      padding: 34px 28px 40px;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), 
                  inset 0 1px 0 rgba(255, 215, 225, 0.15);
      border: 1px solid rgba(255, 200, 210, 0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 20%, rgba(255, 80, 120, 0.06), transparent 50%);
      pointer-events: none;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 600;
      color: #fadbe8;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      text-shadow: 0 4px 20px rgba(200, 50, 80, 0.3);
      position: relative;
    }

    h1 i {
      color: #ff5f8f;
      font-size: 2.4rem;
      filter: drop-shadow(0 0 12px #ff3b6f);
    }

    .subhead {
      font-size: 1.1rem;
      font-weight: 400;
      color: #d4a5b5;
      background: rgba(255, 200, 220, 0.06);
      display: inline-block;
      padding: 6px 28px;
      border-radius: 60px;
      margin-bottom: 28px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 200, 210, 0.08);
      letter-spacing: 0.6px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .question-box {
      background: rgba(30, 12, 18, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 100px;
      padding: 22px 18px;
      margin: 12px 0 30px;
      border: 1px solid rgba(255, 200, 215, 0.06);
      box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0,0,0,0.2);
    }

    #questionText {
      font-size: 2.2rem;
      font-weight: 500;
      color: #fce3ec;
      line-height: 1.3;
      min-height: 4rem;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    #questionText i {
      margin-right: 10px;
      color: #ff6f96;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      margin: 28px 0 14px;
    }

    .btn {
      border: none;
      background: rgba(50, 25, 35, 0.6);
      padding: 16px 36px;
      border-radius: 100px;
      font-size: 1.5rem;
      font-weight: 600;
      color: #f2dbe4;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.7);
      display: inline-flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      border: 1px solid rgba(255, 200, 215, 0.08);
      backdrop-filter: blur(6px);
      background: rgba(40, 18, 28, 0.5);
      flex: 1 1 auto;
      min-width: 130px;
      justify-content: center;
      letter-spacing: 0.3px;
    }

    .btn:hover {
      transform: scale(0.96);
      background: rgba(70, 30, 45, 0.7);
      border-color: rgba(255, 140, 170, 0.2);
      box-shadow: 0 8px 28px -4px #b34a6a30;
    }

    .btn:active {
      transform: scale(0.92);
    }

    .btn-yes {
      background: linear-gradient(145deg, #c0395a, #a02a48);
      color: white;
      border-color: #e05a7a;
      box-shadow: 0 8px 24px -4px #8f2a48;
    }

    .btn-yes:hover {
      background: linear-gradient(145deg, #d44a6a, #b03252);
      color: white;
      box-shadow: 0 8px 28px -2px #b33a5a;
    }

    .btn-no {
      background: rgba(60, 35, 45, 0.6);
      color: #d4b8c2;
      border-color: rgba(200, 160, 170, 0.1);
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.6);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-no.shrink {
      transform: scale(0.25);
      opacity: 0.4;
      pointer-events: none;
      background: rgba(40, 20, 30, 0.3);
    }

    .btn-no.shrink:hover {
      transform: scale(0.25);
    }

    .btn-no:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .reset-area {
      margin-top: 30px;
      display: flex;
      justify-content: center;
    }

    #resetBtn {
      background: transparent;
      border: 1px solid rgba(255, 200, 215, 0.1);
      color: #c9a5b2;
      padding: 10px 28px;
      border-radius: 60px;
      font-size: 0.95rem;
      font-weight: 400;
      backdrop-filter: blur(4px);
      background: rgba(20, 10, 15, 0.3);
      transition: 0.2s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.4px;
    }

    #resetBtn:hover {
      background: rgba(255, 200, 215, 0.05);
      border-color: rgba(255, 160, 180, 0.3);
      color: #f0d5df;
      transform: scale(1.02);
    }

    .love-note {
      margin: 24px 0 8px;
      font-size: 1.3rem;
      font-weight: 500;
      color: #fadbe8;
      background: rgba(30, 12, 18, 0.4);
      padding: 18px 14px;
      border-radius: 80px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 200, 215, 0.05);
      min-height: 5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.2);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    .love-note i {
      color: #ff5f8f;
      filter: drop-shadow(0 0 8px #ff3b6f55);
    }

    .hidden {
      display: none !important;
    }

    .range-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 12px 0 10px;
      background: rgba(20, 8, 14, 0.5);
      padding: 20px 16px 22px;
      border-radius: 100px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 200, 215, 0.04);
    }

    .range-wrap label {
      font-weight: 500;
      color: #dbbac7;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-wrap input[type="range"] {
      width: 80%;
      max-width: 300px;
      accent-color: #e05a7a;
      height: 5px;
      border-radius: 20px;
      background: #3a1f2b;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }

    .range-value {
      font-weight: 600;
      color: #f0d5df;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 24px;
      border-radius: 60px;
      font-size: 1.3rem;
      min-width: 80px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 200, 215, 0.05);
    }

    .range-submit {
      background: linear-gradient(145deg, #c0395a, #9e2a46);
      border: none;
      color: white;
      padding: 10px 32px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.1rem;
      margin-top: 6px;
      transition: 0.2s;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(160, 40, 70, 0.3);
      border: 1px solid rgba(255, 140, 170, 0.15);
      letter-spacing: 0.5px;
    }
    .range-submit:hover {
      background: linear-gradient(145deg, #d44a6a, #b03252);
      transform: scale(0.96);
      box-shadow: 0 8px 24px rgba(200, 50, 80, 0.4);
    }
    .range-submit:active {
      transform: scale(0.92);
    }

    .fade-in {
      animation: glowPop 0.4s ease forwards;
    }

    @keyframes glowPop {
      0% { opacity: 0.5; transform: scale(0.94); box-shadow: 0 0 0 rgba(255, 80, 120, 0); }
      100% { opacity: 1; transform: scale(1); box-shadow: 0 0 30px rgba(255, 60, 100, 0.15); }
    }

    /* Song control */
    .song-control {
      margin: 12px 0 4px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 60px;
      padding: 10px 16px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 200, 215, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .song-control button {
      background: rgba(255, 200, 215, 0.1);
      border: 1px solid rgba(255, 200, 215, 0.15);
      color: #f0d5df;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .song-control button:hover {
      background: rgba(255, 200, 215, 0.2);
      transform: scale(0.96);
    }

    .song-label {
      color: #dbbac7;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    /* Volume slider */
    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #dbbac7;
      font-size: 0.8rem;
    }

    .volume-control input[type="range"] {
      width: 60px;
      accent-color: #e05a7a;
      height: 3px;
      border-radius: 10px;
      background: #3a1f2b;
    }

    .credit {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #a06f7e;
      letter-spacing: 0.5px;
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      .card { padding: 24px 16px; border-radius: 40px; }
      h1 { font-size: 2.2rem; }
      #questionText { font-size: 1.6rem; }
      .btn { padding: 14px 20px; font-size: 1.2rem; min-width: 100px; }
      .range-wrap { padding: 16px 12px; }
    }
  </style>
</head>
<body>
  <div class="card" id="appCard">
    <h1>
      <i class="fas fa-heart"></i> love check
      <i class="fas fa-heart" style="font-size: 2rem;"></i>
    </h1>
    <div class="subhead">
      <i class="fas fa-arrow-right" style="margin-right: 8px;"></i> for my best Tasneem
    </div>

    <div class="question-box">
      <div id="questionText">
        <i class="fas fa-question-circle"></i> Do you love me?
      </div>
    </div>

    <div class="btn-group" id="buttonGroup">
      <button class="btn btn-yes" id="yesBtn"><i class="fas fa-check-circle"></i> Yes</button>
      <button class="btn btn-no" id="noBtn"><i class="fas fa-times-circle"></i> No</button>
    </div>

    <div id="rangeContainer" class="range-wrap hidden">
      <label><i class="fas fa-sliders-h"></i> How much do you love me?</label>
      <input type="range" id="loveRange" min="0" max="100" value="50">
      <div class="range-value" id="rangeDisplay">50%</div>
      <button class="range-submit" id="rangeSubmit"><i class="fas fa-check"></i> Confirm</button>
    </div>

    <div id="loveMessage" class="love-note">
      <i class="fas fa-heart" style="color: #ff5f8f;"></i>
      <span id="messageText">💕 waiting for your answer...</span>
    </div>

    <div class="reset-area">
      <button id="resetBtn"><i class="fas fa-undo-alt"></i> start over</button>
    </div>

    <!-- MP3 Audio Player -->
    <audio id="audioPlayer" loop preload="auto">
      <source src="Y2Mate.is - We Maloh.mp3" type="audio/mpeg">
      Your browser doesn't support audio.
    </audio>

    <!-- Song control -->
    <div class="song-control">
      <span class="song-label">
        <i class="fas fa-music"></i> Amr Diab · We Malloh
      </span>
      <button id="playSongBtn"><i class="fas fa-play"></i> Play</button>
      <button id="pauseSongBtn"><i class="fas fa-pause"></i> Pause</button>
      <div class="volume-control">
        <i class="fas fa-volume-down"></i>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
      </div>
    </div>
    <div class="credit">✨ for Tasneem, with all my heart</div>
  </div>

  <script>
    (function() {
      const state = {
        step: 'initial',
        loveValue: 50,
        noClicks: 0,
        songStarted: false,
      };

      const questionEl = document.getElementById('questionText');
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const rangeContainer = document.getElementById('rangeContainer');
      const loveRange = document.getElementById('loveRange');
      const rangeDisplay = document.getElementById('rangeDisplay');
      const rangeSubmit = document.getElementById('rangeSubmit');
      const messageText = document.getElementById('messageText');
      const resetBtn = document.getElementById('resetBtn');
      const playBtn = document.getElementById('playSongBtn');
      const pauseBtn = document.getElementById('pauseSongBtn');
      const audioPlayer = document.getElementById('audioPlayer');
      const volumeSlider = document.getElementById('volumeSlider');

      // ─── set start time to 0:26 ───
      function setStartTime() {
        audioPlayer.currentTime = 26; // 0:26 in seconds
      }

      // ─── render ───
      function render() {
        if (state.step === 'initial') {
          questionEl.innerHTML = `<i class="fas fa-question-circle"></i> Do you love me?`;
          yesBtn.classList.remove('hidden');
          noBtn.classList.remove('hidden');
          rangeContainer.classList.add('hidden');
          noBtn.classList.remove('shrink');
          noBtn.disabled = false;
          messageText.innerHTML = `💕 waiting for your answer...`;
          noBtn.style.transform = 'scale(1)';
          noBtn.style.opacity = '1';
        } 
        else if (state.step === 'range') {
          questionEl.innerHTML = `<i class="fas fa-heart"></i> How much do you love me?`;
          yesBtn.classList.add('hidden');
          noBtn.classList.add('hidden');
          rangeContainer.classList.remove('hidden');
          noBtn.classList.remove('shrink');
          noBtn.disabled = false;
          updateRangeDisplay();
          messageText.innerHTML = `💖 slide & tell me!`;
        } 
        else if (state.step === 'final') {
          questionEl.innerHTML = `<i class="fas fa-star"></i> You're my everything ✨`;
          yesBtn.classList.add('hidden');
          noBtn.classList.add('hidden');
          rangeContainer.classList.add('hidden');
        }

        if (state.step === 'initial' && state.noClicks > 0) {
          const scale = Math.max(0.2, 1 - state.noClicks * 0.18);
          noBtn.style.transform = `scale(${scale})`;
          noBtn.style.opacity = Math.min(1, 0.6 + state.noClicks * 0.1);
          if (scale < 0.4) {
            noBtn.classList.add('shrink');
            noBtn.disabled = true;
          } else {
            noBtn.classList.remove('shrink');
            noBtn.disabled = false;
          }
        } else if (state.step === 'initial' && state.noClicks === 0) {
          noBtn.style.transform = 'scale(1)';
          noBtn.style.opacity = '1';
          noBtn.classList.remove('shrink');
          noBtn.disabled = false;
        }
      }

      function updateRangeDisplay() {
        const val = loveRange.value;
        rangeDisplay.textContent = val + '%';
        state.loveValue = parseInt(val, 10);
      }

      function setFinalMessage() {
        state.step = 'final';
        messageText.innerHTML = `🌹 i love u to my best <strong>Tasneem</strong> in the world 🌹 <i class="fas fa-heart" style="color:#ff5f8f;"></i>`;
        // start song if not playing, and set time to 0:26
        if (!state.songStarted) {
          playSong();
        } else {
          // if already playing, just ensure time is 0:26
          audioPlayer.currentTime = 26;
        }
        render();
        document.getElementById('loveMessage').classList.add('fade-in');
        setTimeout(() => {
          document.getElementById('loveMessage').classList.remove('fade-in');
        }, 500);
      }

      // ===== MP3 PLAYER FUNCTIONS =====
      function playSong() {
        try {
          // set start time to 0:26 before playing
          setStartTime();
          audioPlayer.play().then(() => {
            state.songStarted = true;
            console.log('🎵 Song is playing from 0:26');
            playBtn.innerHTML = '<i class="fas fa-play"></i> Playing...';
            setTimeout(() => {
              playBtn.innerHTML = '<i class="fas fa-play"></i> Play';
            }, 2000);
          }).catch(error => {
            console.error('Playback error:', error);
            messageText.innerHTML = `⚠️ Click the play button to start the song!`;
          });
        } catch (error) {
          console.error('Play error:', error);
        }
      }

      function pauseSong() {
        try {
          audioPlayer.pause();
          state.songStarted = false;
          console.log('⏸️ Song paused');
          pauseBtn.innerHTML = '<i class="fas fa-pause"></i> Paused';
          setTimeout(() => {
            pauseBtn.innerHTML = '<i class="fas fa-pause"></i> Pause';
          }, 1500);
        } catch (error) {
          console.error('Pause error:', error);
        }
      }

      function setVolume(value) {
        audioPlayer.volume = parseFloat(value);
      }
      // ===== END MP3 FUNCTIONS =====

      function handleRangeSubmit() {
        const val = parseInt(loveRange.value, 10);
        if (val < 100) {
          messageText.innerHTML = `❌ wrong answer! must be 100% full ❌ <i class="fas fa-frown"></i>`;
          rangeContainer.classList.add('fade-in');
          setTimeout(() => rangeContainer.classList.remove('fade-in'), 400);
          return;
        } 
        setFinalMessage();
      }

      function resetGame() {
        state.step = 'initial';
        state.noClicks = 0;
        state.loveValue = 50;
        loveRange.value = '50';
        updateRangeDisplay();
        noBtn.style.transform = 'scale(1)';
        noBtn.style.opacity = '1';
        noBtn.classList.remove('shrink');
        noBtn.disabled = false;
        rangeContainer.classList.add('hidden');
        yesBtn.classList.remove('hidden');
        noBtn.classList.remove('hidden');
        messageText.innerHTML = `💕 waiting for your answer...`;
        questionEl.innerHTML = `<i class="fas fa-question-circle"></i> Do you love me?`;
        pauseSong();
        state.songStarted = false;
        document.getElementById('loveMessage').classList.remove('fade-in');
        // reset time to 0:26 when reset
        setStartTime();
        render();
      }

      // ─── Event listeners ───
      yesBtn.addEventListener('click', function() {
        if (state.step === 'initial') {
          state.step = 'range';
          state.noClicks = 0;
          render();
        }
      });

      noBtn.addEventListener('click', function() {
        if (state.step !== 'initial') return;
        state.noClicks += 1;
        const scale = Math.max(0.2, 1 - state.noClicks * 0.18);
        noBtn.style.transform = `scale(${scale})`;
        noBtn.style.opacity = Math.min(1, 0.6 + state.noClicks * 0.1);
        if (scale < 0.4) {
          noBtn.classList.add('shrink');
          noBtn.disabled = true;
        } else {
          noBtn.classList.remove('shrink');
          noBtn.disabled = false;
        }
        questionEl.innerHTML = `<i class="fas fa-redo-alt"></i> Do you love me? (say yes!)`;
        messageText.innerHTML = `😢 ask again... click Yes!`;
      });

      loveRange.addEventListener('input', function() {
        updateRangeDisplay();
      });

      rangeSubmit.addEventListener('click', handleRangeSubmit);
      resetBtn.addEventListener('click', resetGame);

      // Song controls
      playBtn.addEventListener('click', function() {
        playSong();
        messageText.innerHTML = `🎵 Playing Amr Diab · We Malloh <i class="fas fa-heart" style="color:#ff5f8f;"></i>`;
        setTimeout(() => {
          if (state.step === 'initial') {
            messageText.innerHTML = `💕 waiting for your answer...`;
          }
        }, 3000);
      });

      pauseBtn.addEventListener('click', function() {
        pauseSong();
        messageText.innerHTML = `⏸️ Paused <i class="fas fa-heart" style="color:#ff5f8f;"></i>`;
        setTimeout(() => {
          if (state.step === 'initial') {
            messageText.innerHTML = `💕 waiting for your answer...`;
          }
        }, 2000);
      });

      volumeSlider.addEventListener('input', function() {
        setVolume(this.value);
      });

      // Ensure looping continues
      audioPlayer.addEventListener('ended', function() {
        if (state.songStarted) {
          // when loop ends, restart from 0:26
          setStartTime();
          this.play().catch(e => console.log('Loop replay blocked'));
        }
      });

      // ─── Preload and set start time ───
      window.addEventListener('load', function() {
        audioPlayer.load();
        setStartTime(); // 0:26
        console.log('💖 Love game ready for Tasneem!');
        console.log('🎵 Using MP3: Y2Mate.is - We Maloh.mp3');
        console.log('🎵 Song starts from 0:26');
        console.log('🔊 Volume slider controls the audio level');
      });

      render();
    })();
  </script>
</body>
</html>
